name: "Sui++"
author: "Hology9"
description: |
  Suipepe

type: "DynamicContainer"
value: 1000
provide: "./dist"

container:
  flagTemplate: "HOLOGY9{Su1Ch4n_w4444_Ky0uu_Mouu_K4w4iii!!!_[TEAM_HASH]}"
  containerImage: "{{.slug}}:latest"
  memoryLimit: 512
  cpuCount: 1
