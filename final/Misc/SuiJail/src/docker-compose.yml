services:
  penitentiary:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-31337}:31337"
    environment:
      GZCTF_FLAG: "${GZCTF_FLAG:-FLAG{development_flag}}"
      NO_COLOR: "${NO_COLOR:-}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
