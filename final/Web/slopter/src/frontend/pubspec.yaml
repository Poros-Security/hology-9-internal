name: slopter
description: Slopter merchant dashboard
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  fonts:
    - family: Geist
      fonts:
        - asset: fonts/Geist-400.ttf
          weight: 400
        - asset: fonts/Geist-500.ttf
          weight: 500
        - asset: fonts/Geist-600.ttf
          weight: 600
    - family: Bricolage
      fonts:
        - asset: fonts/Bricolage-500.ttf
          weight: 500
        - asset: fonts/Bricolage-600.ttf
          weight: 600
        - asset: fonts/Bricolage-700.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: fonts/GeistMono-400.ttf
          weight: 400
        - asset: fonts/GeistMono-500.ttf
          weight: 500
