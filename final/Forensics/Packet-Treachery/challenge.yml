# yaml-language-server: $schema=https://raw.githubusercontent.com/dimasma0305/gzcli/refs/heads/main/internal/template/templates/others/ctf-template/.gzctf/challenge.schema.yaml

name: "Packet Treachery"
author: "ghoti"

category: "Forensics"

description: |
  We have a confirmed breach, but the exact exploit chain is unknown.
  An attacker targeted an exposed service, chained it into remote execution,
  and exfiltrated sensitive data
 

type: "DynamicContainer" # don't touch this value
value: 1000 # don't touch this value

container:
  flagTemplate: "HOLOGY9{3xc3pt10n_r3sp0ns3_g03s_brrr_[TEAM_HASH]}"
  containerImage: "{{.slug}}:latest"
  memoryLimit: 1024
  cpuCount: 2
  storageLimit: 1024
  exposePort: 2234
  enableTrafficCapture: true

scripts:
  start: cd src && docker compose up -d --build

