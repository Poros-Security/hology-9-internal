# yaml-language-server: $schema=https://raw.githubusercontent.com/dimasma0305/gzcli/refs/heads/main/internal/template/templates/others/ctf-template/.gzctf/challenge.schema.yaml

name: "BrineVault Secure Terminal"
author: "anakmamah"

description: |
  BrineVault has built a Secure Terminal with a cutting-edge Python serialization engine for session management.

type: "DynamicContainer"
value: 1000

provide: "./dist"

container:
  flagTemplate: "HOLOGY9{p1ckl3_d3s3r1al1z4t10n_th1ng_[TEAM_HASH]}"
  containerImage: "{{.slug}}:latest"
  memoryLimit: 1024
  cpuCount: 2
  storageLimit: 1024
  exposePort: 3000
  enableTrafficCapture: true

scripts:
  start: cd src && docker build -t {{.slug}} .
