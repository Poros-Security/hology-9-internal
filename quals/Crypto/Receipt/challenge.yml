name: "Receipt"
author: "Jersyy"

description: |
  Karaoke night got audited. Keep the receipt.

type: "DynamicContainer"
value: 1000

container:
  flagTemplate: "HOLOGY9{m4k4s1h_ud4h_c0b41n_ch4ll_s4y4_g4s_subm1t_[TEAM_HASH]}"
  containerImage: "{{.slug}}:latest"
  memoryLimit: 512
  cpuCount: 1
  storageLimit: 512
  exposePort: 8000
  enableTrafficCapture: false

provide: "./dist"

scripts:
  start: cd src && docker build -t {{.slug}} .
