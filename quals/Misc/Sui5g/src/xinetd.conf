defaults
{
    instances = 16
    log_type = FILE /dev/stderr
    log_on_failure = HOST
    per_source = 8
    cps = 40 10
}

service sui5g
{
    type = UNLISTED
    disable = no
    socket_type = stream
    protocol = tcp
    port = 1337
    bind = 0.0.0.0
    wait = no
    user = ctf
    server = /usr/bin/python3
    server_args = -E -s -u -B /app/challenge.py
    rlimit_cpu = 15
    rlimit_as = 100663296
    flags = IPv4
}
