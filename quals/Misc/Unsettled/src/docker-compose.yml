services:
  launcher:
    build:
      context: .
    ports:
      - "${PUBLIC_PORT:-5000}:5000"
    environment:
      - FLAG=${FLAG:-HOLOGY9{https://www.facebook.com/share/p/1BZZtHEry6/?_[TEAM_HASH]}}
      - GZCTF_FLAG=${GZCTF_FLAG:-}
      - LAUNCHER_PORT=5000
      - DISABLE_TICKET=true
      - EVM_VERSION=${EVM_VERSION:-shanghai}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
