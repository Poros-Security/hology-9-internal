# yaml-language-server: $schema=https://raw.githubusercontent.com/dimasma0305/gzcli/refs/heads/main/internal/template/templates/others/ctf-template/.gzctf/challenge.schema.yaml

name: "blueprint"
author: "zenc"

description: |
  TaskForge just migrated from REST to GraphQL. The team was in a hurry and might have left a few "legacy" or "ops-only" things lying around before going live.

  `Tidak perlu fuzzing challenge ini`


type: "DynamicContainer"
value: 1000

container:
  flagTemplate: "HOLOGY9{3z_9raphqL_1ntr0sp3ct10n_h0loo[TEAM_HASH]}"
  containerImage: "{{.slug}}:latest"
  memoryLimit: 256
  cpuCount: 1
  storageLimit: 512
  exposePort: 8011
  enableTrafficCapture: false

scripts:
  start: cd src && docker build -t {{.slug}} .
