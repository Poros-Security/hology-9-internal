# yaml-language-server: $schema=https://raw.githubusercontent.com/dimasma0305/gzcli/refs/heads/main/internal/template/templates/others/ctf-template/.gzctf/challenge.schema.yaml

name: "SuiCar"
author: "Suisayy"

description: |
  Suicar  

type: "DynamicContainer"
value: 1000

provide: "./dist"

container:
  flagTemplate: "HOLOGY9{Su1C4r_3nt3rt4inm3Nt_5y5T3m_S33ms_t0_b3_un54f3_hUhh_[TEAM_HASH]}"
  containerImage: "{{.slug}}:latest"
  memoryLimit: 1024
  cpuCount: 2
  storageLimit: 512
  exposePort: 31337
  enableTrafficCapture: false

scripts:
  start: cd src && docker build -t {{.slug}}:latest .
