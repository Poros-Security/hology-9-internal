service suicar
{
    disable         = no
    type            = UNLISTED
    socket_type     = stream
    protocol        = tcp
    wait            = no
    user            = ctf
    server          = /home/ctf/runner.sh
    port            = 31337

    instances       = 6
    per_source      = 2
    cps             = 20 5

    # Pointer-compressed V8 reserves a 4 GiB virtual address cage.
    rlimit_as       = 17179869184
    log_type        = FILE /dev/stderr
    log_on_success  = PID HOST EXIT
    log_on_failure  = HOST
}
