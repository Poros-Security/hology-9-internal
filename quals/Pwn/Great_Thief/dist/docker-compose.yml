services:
  example:
    image: great-thief
    build: .
    restart: on-failure
    environment:
      GZCTF_FLAG: "${GZCTF_FLAG:-}"
    ports:
      - 8011:8011
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.25"
          memory: "128M"
